name: landed

x-service-env: &service-env
  NODE_ENV: development
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-do-not-deploy}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    # Transactions need a replica set, so the check also starts one on first boot.
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }"
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  storage:
    image: rustfs/rustfs
    ports: ["9000:9000"]
    environment:
      RUSTFS_ACCESS_KEY: landed
      RUSTFS_SECRET_KEY: landed-dev-secret
    volumes: ["storage-data:/data"]

  # Creates the bucket on first boot and makes its files publicly readable, like R2 in production.
  storage-setup:
    image: amazon/aws-cli
    depends_on: [storage]
    environment:
      AWS_ACCESS_KEY_ID: landed
      AWS_SECRET_ACCESS_KEY: landed-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://storage:9000
    entrypoint:
      - sh
      - -c
      - |
        until aws s3api list-buckets > /dev/null 2>&1; do sleep 1; done
        aws s3api create-bucket --bucket landed-uploads 2> /dev/null
        aws s3api put-bucket-policy --bucket landed-uploads --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::landed-uploads/*"]}]}'
        aws s3api put-bucket-cors --bucket landed-uploads --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:5173"],"AllowedMethods":["PUT","GET"],"AllowedHeaders":["*"]}]}'

  identity:
    build:
      context: .
      args: { APP: identity }
    environment:
      <<: *service-env
      IDENTITY_MONGODB_URI: mongodb://mongo:27017/landed_identity?replicaSet=rs0
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Landed <no-reply@landed.local>}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  community:
    build:
      context: .
      args: { APP: community }
    environment:
      <<: *service-env
      COMMUNITY_MONGODB_URI: mongodb://mongo:27017/landed_community?replicaSet=rs0
      # Only the seed script reads this, to create the sample accounts.
      IDENTITY_MONGODB_URI: mongodb://mongo:27017/landed_identity?replicaSet=rs0
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    build:
      context: .
      args: { APP: gateway }
    ports: ["3000:3000"]
    environment:
      <<: *service-env
      PORT: 3000
      # Signing doesn't connect to storage. Browsers use this address, so it stays localhost.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-landed-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-landed}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-landed-dev-secret}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/landed-uploads}
    depends_on:
      redis: { condition: service_healthy }
      identity: { condition: service_started }
      community: { condition: service_started }

volumes:
  mongo-data:
  storage-data:
