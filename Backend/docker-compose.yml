name: landed

x-service-env: &service-env
  NODE_ENV: development
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-do-not-deploy}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    # Transactions need a replica set, so the check also starts one on first boot.
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }"
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  identity:
    build:
      context: .
      args: { APP: identity }
    environment:
      <<: *service-env
      IDENTITY_MONGODB_URI: mongodb://mongo:27017/landed_identity?replicaSet=rs0
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: Landed <no-reply@landed.local>
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    build:
      context: .
      args: { APP: gateway }
    ports: ["3000:3000"]
    environment:
      <<: *service-env
      PORT: 3000
    depends_on:
      redis: { condition: service_healthy }
      identity: { condition: service_started }

volumes:
  mongo-data:
